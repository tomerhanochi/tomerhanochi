name: Update README cards

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate top languages card (light)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: hide=typst&layout=compact&show_icons=true
          path: profile/top-langs.svg
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card (dark)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: hide=typst&layout=compact&show_icons=true&theme=dark
          path: profile/top-langs-dark.svg
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card libsubid (light)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: pin
          options: repo=libsubid
          path: profile/pin-libsubid.svg
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card libsubid (dark)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: pin
          options: repo=libsubid&theme=dark
          path: profile/pin-libsubid-dark.svg
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card homelab (light)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: pin
          options: repo=homelab
          path: profile/pin-homelab.svg
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card homelab (dark)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: pin
          options: repo=homelab&theme=dark
          path: profile/pin-homelab-dark.svg
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card services (light)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: pin
          options: repo=services
          path: profile/pin-services.svg
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card services (dark)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: pin
          options: repo=services&theme=dark
          path: profile/pin-services-dark.svg
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card website (light)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: pin
          options: repo=website
          path: profile/pin-website.svg
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card website (dark)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: pin
          options: repo=website&theme=dark
          path: profile/pin-website-dark.svg
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
